# Cross-platform desktop build (see DESKTOP.md). PyInstaller cannot
# cross-compile, so each OS builds its own bundle — using the SAME script a
# developer runs locally (scripts/build_desktop.py). CI only adds system
# deps, caching, artifact upload, and the GitHub Release on tags.
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Merge-to-main validation build: artifacts only, no Release (the
    # `release` job is gated on refs/tags/v). Branch/PR pushes get the
    # lightweight ci.yml instead.
    branches: [main]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # tag builds publish a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          # Apple Silicon only — Intel Macs are no longer supported targets.
          - os: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # NOTE: setup-uv has no bare v8 major tag — pin the exact release.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # opencv (docling table structure) needs these at runtime on Linux.
      # The Qt WebEngine runtime libs are for the headless --check-webview
      # gate in the build (offscreen); end-user machines need them too — see
      # DESKTOP.md "Startup performance"/packaging notes.
      - name: Linux system libs for opencv + Qt WebEngine
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxcb1 libxcb-cursor0 libnss3 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # The single build step — identical to a local manual build.
      - name: Build (frontend + backend + PyInstaller + smoke + archive)
        run: python scripts/build_desktop.py --version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v6
        with:
          name: gitessay-${{ matrix.artifact }}
          path: |
            backend/dist/gitessay-*-${{ matrix.artifact }}.AppImage
            backend/dist/gitessay-*-${{ matrix.artifact }}.AppImage.sha256
            backend/dist/gitessay-*-${{ matrix.artifact }}-setup.exe
            backend/dist/gitessay-*-${{ matrix.artifact }}-setup.exe.sha256
            backend/dist/gitessay-*-${{ matrix.artifact }}.dmg
            backend/dist/gitessay-*-${{ matrix.artifact }}.dmg.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: gitessay-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: gitessay-*
          generate_release_notes: true
