# Lightweight CI on every push / PR: fast feedback (backend tests ~seconds,
# frontend build ~1 min). The heavy 3-platform desktop packaging stays in
# desktop.yml (main pushes, v* tags, manual) — see DESKTOP.md.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # NOTE: setup-uv has no bare v8 major tag — pin the exact release.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - run: uv sync --group dev
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
