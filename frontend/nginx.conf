# gitEssay frontend nginx config.
#
# Serves the built Vite bundle and reverse-proxies /api → http://backend:8000
# (the compose service name). proxy_buffering OFF is REQUIRED: the chat agent
# streams via Server-Sent Events at /api/chat/stream, and nginx buffers SSE by
# default (the user would not see live thinking/text until the stream closed).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads (the entry JS is ~1.85 MB raw / ~0.5 MB gzipped).
    # application/json covers API responses proxied below; SSE stays unbuffered
    # and gzip does not apply to it (text/event-stream is not in gzip_types).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + SSE streaming → backend. No trailing slash on proxy_pass so the
    # /api/ prefix is preserved (backend routes are /api/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Literature uploads: nginx's default client_max_body_size is 1m, which
        # 413s PDFs long before the backend's own 50 MB cap. 60m gives the
        # backend room to return its own (friendlier) 413 past 50 MB.
        client_max_body_size 60m;

        # SSE: disable buffering and lengthen the read timeout (reasoning models
        # can be slow to first byte).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Static assets (hashed, immutable) — long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html: it references hashed /assets chunks that change
    # every deploy. A stale HTML would point at deleted chunks → blank page.
    # no-cache = may store, must revalidate (ETag keeps revalidation cheap).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
