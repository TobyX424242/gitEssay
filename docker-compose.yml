# gitEssay — one-command local stack.
#
#   docker compose up --build      # build + launch
#   docker compose up -d           # detached
#   docker compose logs -f backend # tail backend logs
#   docker compose down            # stop (keeps the db volume)
#   doccer compose down -v         # stop + DELETE the SQLite volume
#
# Open the app at http://localhost:5180 (nginx). The backend is internal-only;
# the frontend proxies /api → http://backend:8000.
#
# Your SQLite data (projects/checkpoints/conversations + the server-side AI key)
# lives in the `gitessay-data` named volume and persists across rebuilds.

services:
  backend:
    build: ./backend
    container_name: gitessay-backend
    # SQLite lives here (see app/db.py: DB_PATH = $GITESSAY_DB).
    environment:
      GITESSAY_DB: /app/data/gitessay.db
    volumes:
      - gitessay-data:/app/data
      #- ./backend/gitessay.db:/app/data/gitessay.db
    expose:
      - "8000" # internal only — the frontend proxies to it
    restart: unless-stopped
    healthcheck:
      # Root route returns the JSON status banner (no auth, no deps).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # torch/docling import at startup is slow — don't count it as failing.
      start_period: 120s

  frontend:
    build: ./frontend
    container_name: gitessay-frontend
    ports:
      # Loopback only: the API is unauthenticated (single-user local app), so
      # publishing on all interfaces would expose project export/delete and
      # LLM-quota endpoints to the LAN. Remove the 127.0.0.1 prefix only if
      # you understand that trade-off.
      - "127.0.0.1:5180:80" # http://localhost:5180
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # nginx:alpine ships busybox wget. Use 127.0.0.1, not localhost — busybox
      # wget resolves localhost to ::1 first, but nginx only listens on IPv4,
      # so the check would flap the container to "unhealthy" while it serves fine.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gitessay-data:
