[project]
name = "gitessay-backend"
version = "0.1.0"
description = "gitEssay backend — persistence (projects/checkpoints/conversations) + AI gateway"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "httpx>=0.27",
    "langgraph>=1.2.7",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "langchain-anthropic>=1.4.8",
    "docling>=2.113.0",
    # Direct pins so the pytorch-cpu index source below actually applies (uv
    # only honours [tool.uv.sources] for packages the project names directly).
    "torch>=2.13",
    "torchvision>=0.28",
    "python-multipart>=0.0.32",
    "numpy>=2.2.6",
    # Headless OpenCV: docling pulls opencv-python, whose wheel bundles Qt GUI
    # libs (~100 MB) and needs system libGL/libxcb at runtime. The headless
    # build has the same API minus the GUI — see the override below, which
    # prunes opencv-python from the resolution.
    "opencv-python-headless>=4.10",
    "edgeparse>=0.2.5",
    # LLM API key storage in the OS keychain (macOS Keychain / Windows
    # Credential Manager / Linux Secret Service), with a DB fallback when no
    # backend exists (Docker, headless) — see app/secrets.py.
    "keyring>=25",
    # Exponential-backoff retries for transient LLM gateway failures (ai.py).
    "tenacity>=9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
]
# Desktop packaging (see DESKTOP.md): `uv sync --group desktop`, then
# `uv run python -m app.desktop` or `uv run pyinstaller desktop.spec`.
desktop = [
    "platformdirs>=4.3",
    "pywebview>=5.4",
    "pyinstaller>=6.11",
]

# CPU-only PyTorch wheels: the PyPI `torch` wheel drags in ~3 GB of CUDA
# runtime packages (nvidia-*, triton) that are dead weight in a CPU container.
# docling runs fine on CPU torch (~1–5 s/page). If you want local GPU parsing,
# remove this block and re-lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

# Prune the transitive opencv-python (docling) with an impossible marker —
# opencv-python-headless above provides the same cv2 module without GUI libs.
[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
